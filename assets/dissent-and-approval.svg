<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Dissent remains visible before human approval</title>
  <desc id="desc">Three model perspectives converge on a recommendation while one dissent remains visible and a human approves the action.</desc>
  <rect width="1200" height="640" rx="28" fill="#073546"/>
  <g font-family="Arial, sans-serif">
    <text x="70" y="82" fill="#F8F5EE" font-size="34" font-weight="700">Agreement helps routing.</text>
    <text x="70" y="124" fill="#C1CDBF" font-size="22">Dissent helps review.</text>
    <path d="M170 230C340 230 370 230 510 318" fill="none" stroke="#C1CDBF" stroke-width="6"/>
    <path d="M170 330C340 330 370 330 510 330" fill="none" stroke="#C1CDBF" stroke-width="6"/>
    <path d="M170 430C340 430 370 430 510 342" fill="none" stroke="#C1CDBF" stroke-width="6"/>
    <path d="M170 520C340 520 390 430 510 355" fill="none" stroke="#FA6A48" stroke-width="6" stroke-dasharray="14 12"/>
    <g fill="#F8F5EE" stroke="#C1CDBF" stroke-width="3">
      <rect x="70" y="190" width="200" height="80" rx="18"/><rect x="70" y="290" width="200" height="80" rx="18"/><rect x="70" y="390" width="200" height="80" rx="18"/>
    </g>
    <g fill="#073546" font-size="20" font-weight="700" text-anchor="middle">
      <text x="170" y="238">Model A</text><text x="170" y="338">Model B</text><text x="170" y="438">Model C</text>
    </g>
    <rect x="70" y="480" width="200" height="80" rx="18" fill="#FA6A48"/>
    <text x="170" y="528" fill="#F8F5EE" font-size="20" font-weight="700" text-anchor="middle">Dissent</text>
    <rect x="510" y="260" width="260" height="140" rx="22" fill="#C1CDBF"/>
    <text x="640" y="312" fill="#073546" font-size="22" font-weight="700" text-anchor="middle">Recommendation</text>
    <text x="640" y="350" fill="#073546" font-size="18" text-anchor="middle">evidence + limits</text>
    <path d="M770 330H900" stroke="#C1CDBF" stroke-width="6" marker-end="url(#arrow)"/>
    <rect x="900" y="240" width="220" height="180" rx="22" fill="#FA6A48"/>
    <text x="1010" y="302" fill="#F8F5EE" font-size="24" font-weight="700" text-anchor="middle">Human</text>
    <text x="1010" y="338" fill="#F8F5EE" font-size="24" font-weight="700" text-anchor="middle">approval</text>
    <text x="1010" y="378" fill="#F8F5EE" font-size="17" text-anchor="middle">before action</text>
  </g>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C1CDBF"/></marker></defs>
</svg>
